<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل عملياتي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 p-4">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-3xl shadow-sm p-6 mb-5 border-b-4 border-blue-600">
            <h1 class="text-xs text-blue-500 font-bold mb-1 uppercase tracking-widest">عرض عمليات الرقم</h1>
            <div id="target-phone" class="text-2xl font-black text-gray-800 tracking-tighter">0799229701</div>
        </div>

        <div id="loader" class="flex flex-col items-center py-10">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-2"></div>
            <p class="text-gray-400 text-sm">جاري مزامنة البيانات...</p>
        </div>

        <div id="list" class="space-y-3 hidden">
            </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        async function loadData() {
            const list = document.getElementById('list');
            const loader = document.getElementById('loader');

            try {
                // طلب البيانات من الـ API الخاص بك
                const res = await fetch('/api/get-operations');
                const result = await res.json();

                loader.classList.add('hidden');
                list.classList.remove('hidden');
                list.innerHTML = '';

                if (result.results && result.results.length > 0) {
                    result.results.forEach(op => {
                        list.innerHTML += `
                            <div class="bg-white p-4 rounded-2xl shadow-sm border-r-4 border-green-500 flex justify-between items-center transition hover:scale-[1.02]">
                                <div>
                                    <div class="font-bold text-gray-800 text-sm">${op.type}</div>
                                    <div class="text-[10px] text-gray-400">${op.date}</div>
                                </div>
                                <div class="text-left font-black text-green-600 text-lg">
                                    ${op.amount}
                                </div>
                            </div>
                        `;
                    });
                } else {
                    list.innerHTML = '<p class="text-center text-gray-400 py-10">لا توجد عمليات حالياً.</p>';
                }
            } catch (err) {
                loader.innerHTML = '<p class="text-red-500 text-sm font-bold">حدث خطأ في الاتصال بالسيرفر</p>';
            }
        }

        loadData();
    </script>
</body>
</html>
