<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المعاملات</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-2xl shadow-sm p-5 mb-4 border border-blue-100">
            <h1 class="text-xs text-blue-500 font-bold mb-1">المعاملات النشطة للرقم</h1>
            <div id="target-phone" class="text-xl font-black text-gray-800 tracking-wider">0799229701</div>
        </div>

        <div id="loader" class="flex flex-col items-center py-10">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-2"></div>
            <p class="text-gray-400 text-sm">جاري تحديث البيانات...</p>
        </div>

        <div id="list" class="space-y-3 hidden">
            </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function loadData() {
            const list = document.getElementById('list');
            const loader = document.getElementById('loader');

            try {
                const res = await fetch('/api/get-operations');
                const result = await res.json();

                loader.classList.add('hidden');
                list.classList.remove('hidden');
                list.innerHTML = '';

                if (result.results && result.results.length > 0) {
                    result.results.forEach(op => {
                        list.innerHTML += `
                            <div class="bg-white p-4 rounded-xl shadow-sm border-r-4 border-green-500 flex justify-between items-center">
                                <div>
                                    <div class="font-bold text-gray-700 text-sm">${op.type}</div>
                                    <div class="text-[10px] text-gray-400 font-mono">${op.date}</div>
                                </div>
                                <div class="text-left">
                                    <div class="text-lg font-black text-green-600">${op.amount}</div>
                                    <div class="text-[9px] text-gray-300">عملية ناجحة</div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    list.innerHTML = '<div class="text-center py-10 text-gray-400">لا توجد عمليات مسجلة لهذا الرقم.</div>';
                }
            } catch (err) {
                loader.innerHTML = '<p class="text-red-500 text-sm">فشل تحديث الجلسة. يرجى مراجعة الكوكيز.</p>';
            }
        }

        loadData();
    </script>
</body>
</html>
